<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Logística e Fretes · demonstração</title>
  <meta name="description" content="Painel Streamlit de fretes (Pipefy + SAP + OSRM) rodando no navegador com dados fictícios.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
  <style>
    html, body { margin: 0; background: #0c1810; color: #dff0e4; font-family: 'JetBrains Mono', monospace; }
    #carregando { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 13px;  }
    #carregando b { color: #3ecf6e; font-size: 15px; }
    #carregando span { color: #8aab94; max-width: 520px; text-align: center; line-height: 1.6; padding: 0 16px; }
    html, body, #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root">
    <div id="carregando">
      <b>Carregando o dashboard de fretes…</b>
      <span>O Python roda dentro do navegador (Pyodide + stlite). Na primeira visita leva de 20 a 60 segundos; depois fica em cache.
        Todos os dados são fictícios.</span>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    const arquivos = [
      "Dashboard.py", "config.py", "fontes.py", "motor_distancias.py", "mapa_estados.py", "mapa_brasil.json",
      "fornecedores_frete_exemplo.csv",
      "demo/pipefy_relatorio.csv", "demo/faturamento.csv", "demo/frete_nf.csv", "demo/frete_itens_fornec.csv",
      "demo/cidades.csv", "demo/distancias_cache.xlsx",
    ];
    const files = Object.fromEntries(arquivos.map(a => [a, { url: "./" + a }]));
    mount({
      requirements: ["plotly", "openpyxl", "requests"],
      entrypoint: "Dashboard.py",
      files,
      streamlitConfig: {
        "client.toolbarMode": "viewer",
        "theme.base": "dark",
        "theme.primaryColor": "#3ecf6e",
        "theme.backgroundColor": "#0c1810",
        "theme.secondaryBackgroundColor": "#141f17",
        "theme.textColor": "#dff0e4",
      },
    }, document.getElementById("root"));
    // tira o aviso de carregamento quando o app do Streamlit aparece
    new MutationObserver((_, obs) => {
      if (document.querySelector('[data-testid="stApp"]')) { document.getElementById("carregando")?.remove(); obs.disconnect(); }
    }).observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
